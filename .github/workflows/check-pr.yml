name: Training pull request checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check assets/js/training-app.js
      - run: node tools/audit-project.js
      - run: node tools/audit-buttons.js
      - run: node tools/audit-map-links.js
      - run: node --test tools/primserv-navigation.test.mjs tools/instruction-update.test.mjs
