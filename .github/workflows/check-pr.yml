name: Training pull request checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check assets/js/training-app.js
      - run: node tools/audit-project.js
      - run: node tools/audit-buttons.js
      - run: node tools/audit-map-links.js
      - run: node --test tools/primserv-navigation.test.mjs tools/instruction-update.test.mjs tools/quiz-progress.test.mjs tools/three-d-language-link.test.mjs tools/source-lineage.test.mjs
      - name: Install pinned acceptance browser (CI only)
        run: |
          npm install --prefix "$RUNNER_TEMP/primserv-browser" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/primserv-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: All-language tablet and startup screen acceptance
        env:
          PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/primserv-browser/node_modules/playwright
          BROWSER_REPORT: ${{ runner.temp }}/primserv-browser-report/tablet
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TESTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: node .github/browser/tablet-layout.mjs
      - name: Exact-version glossary browser acceptance
        env:
          PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/primserv-browser/node_modules/playwright
          BROWSER_REPORT: ${{ runner.temp }}/primserv-browser-report
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TESTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: node .github/browser/glossary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glossary-browser-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/primserv-browser-report
          retention-days: 7
